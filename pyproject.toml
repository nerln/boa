[project]
name = "boa"
version = "0.1.0"
description = "A blackboard that agent sessions on one machine write to each other on."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "Eugenio Nerelli"}]

# No runtime dependencies, on purpose. Every dependency is a maintainer who can
# push code onto this machine; the standard library is enough for this job.
dependencies = []

[project.scripts]
boa = "boa.cli:main"
boa-mcp = "boa.mcp:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["boa"]
